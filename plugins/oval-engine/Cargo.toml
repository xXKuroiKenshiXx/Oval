[package]
name = "tauri-plugin-oval-engine"
version = "0.1.0"
authors = ["xXKuroiKenshiXx"]
description = "Runs yt-dlp inside the Android and iOS builds of Oval"
license = "MIT"
edition = "2021"
rust-version = "1.80"
links = "tauri-plugin-oval-engine"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
