name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: cargo test --locked
      - name: Build
        run: npx --yes @tauri-apps/cli@2 build
      - name: Collect
        shell: bash
        run: |
          mkdir dist
          cp target/release/bundle/nsis/*.exe dist/
          cp target/release/oval.exe "dist/Oval-${GITHUB_REF_NAME#v}-portable.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    # The oldest supported runner, so the AppImage runs on older distros too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: cargo test --locked
      - name: Build
        run: npx --yes @tauri-apps/cli@2 build --bundles appimage,deb
      - name: Collect
        run: |
          mkdir dist
          cp target/release/bundle/appimage/*.AppImage target/release/bundle/deb/*.deb dist/
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install             "platforms;android-37" "build-tools;35.0.0" "ndk;27.2.12479018" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Signing key
        # Without the secrets the APK would be unsigned (not installable), so it is skipped.
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/oval.jks"
          printf 'storeFile=%s
storePassword=%s
keyAlias=oval
keyPassword=%s
'             "$RUNNER_TEMP/oval.jks" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > gen/android/keystore.properties
      - name: Build
        if: env.KEYSTORE_B64 != ''
        run: npx --yes @tauri-apps/cli@2 android build --apk --target aarch64 armv7
      - name: Collect
        if: env.KEYSTORE_B64 != ''
        run: |
          mkdir dist
          cp gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk             "dist/Oval_${GITHUB_REF_NAME#v}_android.apk"
      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_B64 != ''
        with:
          name: android
          path: dist/*

  publish:
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v v="$version" '$0 ~ "^## \[" v "\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" \
            --title "Oval ${version}" \
            --notes "${notes:-Oval ${version}}" \
            dist/*
