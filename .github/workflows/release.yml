name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: cargo test --locked
      - name: Build
        run: npx --yes @tauri-apps/cli@2 build
      - name: Collect
        shell: bash
        run: |
          mkdir dist
          cp target/release/bundle/nsis/*.exe dist/
          cp target/release/oval.exe "dist/Oval-${GITHUB_REF_NAME#v}-portable.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    # The oldest supported runner, so the AppImage runs on older distros too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: cargo test --locked
      - name: Build
        run: npx --yes @tauri-apps/cli@2 build --bundles appimage,deb,rpm
      - name: Collect
        run: |
          mkdir dist
          cp target/release/bundle/appimage/*.AppImage target/release/bundle/deb/*.deb             target/release/bundle/rpm/*.rpm dist/
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  # Flatpak, Void and Arch packages repackage the .deb built above.
  flatpak:
    needs: linux
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: linux
      - name: Build
        run: |
          cp linux/*.deb packaging/flatpak/oval.deb
          # The container ships Flathub and the GNOME SDK system-wide.
          flatpak-builder --install-deps-from=flathub --repo=repo --force-clean             build packaging/flatpak/io.github.xxkuroikenshixx.oval.yml
          mkdir dist
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo             repo "dist/Oval_${GITHUB_REF_NAME#v}_x86_64.flatpak" io.github.xxkuroikenshixx.oval
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: dist/*

  distros:
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: linux
      - name: Void Linux
        run: |
          mkdir -p dist
          docker run --rm -v "$PWD:/w" ghcr.io/void-linux/void-glibc-full:latest             sh /w/packaging/void/build.sh /w/linux/Oval_${GITHUB_REF_NAME#v}_amd64.deb "${GITHUB_REF_NAME#v}" /w/dist
      - name: Arch Linux
        run: |
          docker run --rm -v "$PWD:/w" -e VERSION="${GITHUB_REF_NAME#v}" archlinux:latest bash -c '
            set -e
            pacman -Syu --noconfirm --needed base-devel > /dev/null
            useradd -m builder
            cp -r /w/packaging/arch /home/builder/pkg
            cp /w/linux/*.deb /home/builder/pkg/
            sed -i "s/^pkgver=.*/pkgver=$VERSION/" /home/builder/pkg/PKGBUILD
            chown -R builder /home/builder/pkg
            su builder -c "cd /home/builder/pkg && makepkg --nodeps"
            cp /home/builder/pkg/*.pkg.tar.zst /w/dist/'
      - uses: actions/upload-artifact@v4
        with:
          name: distros
          path: dist/*

  android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37" "build-tools;35.0.0" "ndk;27.2.12479018" > /dev/null || true
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Signing key
        # Without the secrets the APK would be unsigned (not installable), so it is skipped.
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/oval.jks"
          {
            echo "storeFile=$RUNNER_TEMP/oval.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=oval"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > gen/android/keystore.properties
      - name: Build
        if: env.KEYSTORE_B64 != ''
        run: npx --yes @tauri-apps/cli@2 android build --apk --target aarch64 armv7
      - name: Collect
        if: env.KEYSTORE_B64 != ''
        run: |
          mkdir dist
          cp gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
            "dist/Oval_${GITHUB_REF_NAME#v}_android.apk"
      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_B64 != ''
        with:
          name: android
          path: dist/*

  publish:
    needs: [windows, linux, flatpak, distros, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v v="$version" 'index($0, "## [" v "]") == 1 {f=1; next} /^## / {f=0} f' CHANGELOG.md)
          # A release may already exist (published by hand with a signed APK);
          # then just add or refresh the files built here.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Oval ${version}" \
              --notes "${notes:-Oval ${version}}" \
              dist/*
          fi
