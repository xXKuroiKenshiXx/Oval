name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: cargo test --locked
      - name: Build
        run: npx --yes @tauri-apps/cli@2 build
      - name: Collect
        shell: bash
        run: |
          mkdir dist
          cp target/release/bundle/nsis/*.exe dist/
          cp target/release/oval.exe "dist/Oval-${GITHUB_REF_NAME#v}-portable.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    # The oldest supported runner, so the AppImage runs on older distros too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: cargo test --locked
      - name: Build
        run: npx --yes @tauri-apps/cli@2 build --bundles appimage,deb
      - name: Collect
        run: |
          mkdir dist
          cp target/release/bundle/appimage/*.AppImage target/release/bundle/deb/*.deb dist/
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v v="$version" '$0 ~ "^## \[" v "\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" \
            --title "Oval ${version}" \
            --notes "${notes:-Oval ${version}}" \
            dist/*
